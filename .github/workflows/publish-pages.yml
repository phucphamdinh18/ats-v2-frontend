name: Publish ATS Pages

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['web/**', 'tests/publish-pages-guard.test.cjs', '.github/workflows/publish-pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ats-pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: https://izchulqhmhqevfmuvqlx.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_3z9T_XwfGujrPObIj-8rbg_bjbpnXnt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web --no-fund --no-audit
      - run: node --test tests/publish-pages-guard.test.cjs
      - run: npm --prefix web test
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run build
        env:
          NEXT_PUBLIC_BASE_PATH: /ats-v2-frontend
          NEXT_PUBLIC_AUTH_REDIRECT_URL: https://phucphamdinh18.github.io/ats-v2-frontend/
      - run: node web/scripts/prepare-pages.mjs single
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/.pages-site

  deploy:
    # PR validation cannot publish. Release is a manual action from main only.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
